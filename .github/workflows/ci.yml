name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Isolated SQLite and Chroma integration check
        run: CHROMA_PYTHON="$(command -v python)" python scripts/check.py
        env:
          ANONYMIZED_TELEMETRY: 'False'
      - run: ./scripts/build.sh "${{ matrix.arch }}"
      - run: codesign --verify --deep --strict 'dist/Memory Atlas.app'
